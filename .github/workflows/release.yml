name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH, received: $env:GITHUB_REF_NAME"
          }
          "value=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: ./packaging/build-release.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = "artifacts/installer/PieceworkReport-Setup-${{ steps.version.outputs.value }}.exe"
          $checksum = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $(Split-Path -Leaf $installer)" | Set-Content -LiteralPath "$installer.sha256" -NoNewline

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/installer/PieceworkReport-Setup-${{ steps.version.outputs.value }}.exe
            artifacts/installer/PieceworkReport-Setup-${{ steps.version.outputs.value }}.exe.sha256
